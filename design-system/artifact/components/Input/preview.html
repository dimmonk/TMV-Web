<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Input</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&display=swap">
</head>
<body>
<div class="tmv-pad" style="display:grid;gap:14px;max-width:420px">
<label style="display:grid;gap:6px"><span style="font:700 11px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted-2)">Child's name</span><input value="Maya" style="font:600 14px/1 var(--font-body);padding:12px 14px;border-radius:10px;border:1px solid var(--ink);background:#fff;box-shadow:0 0 0 3px rgba(33,31,27,.08);outline:none"></label>
<label style="display:grid;gap:6px"><span style="font:700 11px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted-2)">Parent email</span><input placeholder="you@example.com" style="font:600 14px/1 var(--font-body);padding:12px 14px;border-radius:10px;border:1px solid #e3e0d8;background:#f6f5f1;outline:none"></label>
<div style="font:600 13px/1.4 var(--font-body);color:var(--error-text);background:var(--error-fill);padding:10px 12px;border-radius:10px">Add an email so we can send the receipt.</div>
</div>
</body>
</html>
