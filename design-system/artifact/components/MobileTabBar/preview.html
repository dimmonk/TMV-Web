<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MobileTabBar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&display=swap">
</head>
<body>
<div style="padding:40px 0 0;max-width:420px"><nav style="position:relative;background:rgba(28,26,23,.92);display:grid;grid-template-columns:repeat(5,1fr);padding:10px 4px 12px;font:600 10.5px/1 var(--font-body);text-align:center">
<span style="color:#fff">⌂<br>Home</span><span style="color:rgba(255,255,255,.42)">◎<br>Classes</span>
<span style="position:relative"><span style="position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;background:var(--yellow);color:var(--ink);display:grid;place-items:center;font:800 11px/1 var(--font-display);text-transform:uppercase;box-shadow:0 8px 20px -8px rgba(0,0,0,.6)">Book</span></span>
<span style="color:rgba(255,255,255,.42)">▦<br>Schedule</span><span style="color:rgba(255,255,255,.42)">≡<br>More</span></nav></div>

</html>
