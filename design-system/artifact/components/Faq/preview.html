<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Faq</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&display=swap">
</head>
<body>
<div class="tmv-pad" style="display:grid;gap:10px;max-width:640px">
<details open style="background:#fff;border:1px solid #dcd9d1;border-radius:14px;padding:20px 24px;box-shadow:var(--shadow-tile)"><summary style="font:700 16px/1.3 var(--font-display);color:#2b2925;cursor:pointer;list-style:none;display:flex;justify-content:space-between">How early should we arrive?<span style="color:var(--yellow);font-size:22px;transform:rotate(45deg)">+</span></summary><p style="font:400 14px/1.6 var(--font-body);color:#5a574f;margin:10px 0 0">Come 15 minutes before your class to sign in and warm up.</p></details>
<details style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 24px;box-shadow:var(--shadow-tile)"><summary style="font:700 16px/1.3 var(--font-display);color:#2b2925;cursor:pointer;list-style:none;display:flex;justify-content:space-between">What should my child wear?<span style="color:var(--yellow);font-size:22px">+</span></summary><p style="font:400 14px/1.6 var(--font-body);color:#5a574f;margin:10px 0 0">Comfortable clothes and running shoes.</p></details>
</div>
</body>
</html>
