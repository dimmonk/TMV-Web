<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PageHero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&display=swap">
</head>
<body>
<section style="position:relative;overflow:hidden;background:var(--ink);color:#fff;padding:44px 32px;--accent:var(--yellow)">
<div style="position:absolute;inset:0;background:radial-gradient(700px 370px at 89% -13%, rgba(255,212,0,.15), transparent 70%)"></div>
<div style="position:relative;max-width:560px">
<div style="display:flex;align-items:center;gap:10px;font:700 12px/1 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)"><span style="width:22px;height:2px;background:var(--accent)"></span>Parkour &amp; Movement Training Centre · Toronto</div>
<h1 style="font:800 52px/1 var(--font-display);letter-spacing:-.022em;margin:16px 0 0">Come to play. Stay to learn.</h1>
<p style="font:400 16px/1.55 var(--font-body);color:rgba(255,255,255,.72);max-width:460px;margin:14px 0 0">Classes, open gym, camps and parties for every age.</p>
<div class="tmv-row" style="margin-top:22px"><a class="tmv-btn tmv-btn-primary tmv-btn-hero" href="#">Book a session →</a><a class="tmv-btn tmv-btn-ghost-dark tmv-btn-hero" href="#">Explore the gym</a></div>
<div style="display:flex;gap:22px;margin-top:24px"><div><div style="font:800 26px/1 var(--font-display);color:var(--accent)">7 days</div><div style="font:600 12.5px/1.4 var(--font-body);color:rgba(255,255,255,.6)">open every week</div></div><div style="border-left:1px solid rgba(255,255,255,.12);padding-left:22px"><div style="font:800 26px/1 var(--font-display);color:var(--accent)">Ages 3+</div><div style="font:600 12.5px/1.4 var(--font-body);color:rgba(255,255,255,.6)">all levels</div></div></div>
</div></section>
</body>
</html>
