<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JumpNav</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&display=swap">
</head>
<body>
<div style="background:rgba(245,244,241,.92);border-bottom:1px solid var(--line-pill);padding:13px 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
<span style="font:700 11px/1 var(--font-display);letter-spacing:.13em;text-transform:uppercase;color:var(--muted-3);margin-right:6px">Jump to</span>
<a href="#" style="font:700 12.5px/1 var(--font-body);padding:7px 13px;border-radius:999px;background:#fff;border:1px solid #e0c64a;color:var(--ink);text-decoration:none">Open Gym</a>
<a href="#" style="font:700 12.5px/1 var(--font-body);padding:7px 13px;border-radius:999px;border:1px solid transparent;color:var(--text-3);text-decoration:none">Core</a>
<a href="#" style="font:700 12.5px/1 var(--font-body);padding:7px 13px;border-radius:999px;border:1px solid transparent;color:var(--text-3);text-decoration:none">Specialized</a>
<span style="margin-left:auto;display:flex;gap:16px;font:700 13px/1 var(--font-display);color:var(--ink)"><span>Price List</span><span>Full Schedule</span></span>
</div>
</body>
</html>
