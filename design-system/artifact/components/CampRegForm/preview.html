<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CampRegForm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&display=swap">
</head>
<body>
<div class="tmv-pad" style="display:grid;gap:12px;max-width:520px;--accent:var(--cat-camps)">
<div class="tmv-row" style="gap:8px"><span style="font:700 13px/1 var(--font-body);padding:10px 14px;border-radius:10px;border:1.5px solid var(--accent);background:var(--warn-fill)">✓ Weekly</span><span style="font:700 13px/1 var(--font-body);padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff">P.A. Day</span><span style="font:700 13px/1 var(--font-body);padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff">Private Day</span></div>
<div class="tmv-row" style="gap:6px"><span style="width:40px;height:40px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 12px/1 var(--font-body)">Mon</span><span style="width:40px;height:40px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 12px/1 var(--font-body)">Tue</span><span style="width:40px;height:40px;border-radius:9px;background:var(--tile);color:var(--muted);display:grid;place-items:center;font:700 12px/1 var(--font-body)">Wed</span><span style="font:700 11px/1 var(--font-body);color:var(--warn-text);background:#fff2e2;padding:6px 8px;border-radius:999px">4-day week</span></div>
<div style="background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden"><div style="background:var(--ink);color:#fff;padding:12px 16px;font:800 14px/1 var(--font-display);text-transform:uppercase">Summary</div><div style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center"><span style="font:600 12.5px/1 var(--font-body);color:var(--muted)">HST included</span><span style="font:900 26px/1 var(--font-display);color:var(--accent)">Total</span></div><div style="padding:0 16px 16px"><a class="tmv-btn tmv-btn-primary" style="width:100%;justify-content:center;box-sizing:border-box;border-radius:12px" href="#">Register &amp; pay</a></div></div>
</div>
</body>
</html>
