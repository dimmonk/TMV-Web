<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&display=swap">
</head>
<body>
<div class="tmv-pad" style="display:grid;gap:16px">
<div class="tmv-row"><a class="tmv-btn tmv-btn-primary" href="#">Book a session →</a><a class="tmv-btn tmv-btn-dark" href="#">Reserve</a><a class="tmv-btn tmv-btn-ghost" href="#">Price list</a><a class="tmv-link" style="--accent:var(--cat-classes)" href="#">View class <span class="arr">→</span></a></div>
<div class="tmv-row tmv-on-ink" style="padding:16px;border-radius:16px"><a class="tmv-btn tmv-btn-primary tmv-btn-hero" href="#">Book a session →</a><a class="tmv-btn tmv-btn-ghost-dark tmv-btn-hero" href="#">Explore the gym</a></div>
</div>
</body>
