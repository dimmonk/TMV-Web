<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reviews</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&display=swap">
</head>
<body>
<div class="tmv-pad" style="display:grid;gap:16px">
<div style="display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap"><div><div class="tmv-eyebrow">Reviews</div><h2 class="tmv-h2" style="font-size:30px">What families say</h2></div>
<div style="background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;gap:10px;align-items:center"><span style="font:900 38px/1 var(--font-display)">4.6</span><span><span style="color:var(--google-star)">★★★★★</span><br><span style="font:600 12.5px/1 var(--font-body);color:var(--muted)">449 Google reviews</span></span></div></div>
<div style="background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;max-width:420px"><div style="color:var(--google-star)">★★★★★</div><p style="font:500 15px/1.55 var(--font-body);color:var(--text-2);margin:10px 0">A real quote from Google goes here, never an invented one.</p><div style="font:800 14.5px/1 var(--font-display)">Reviewer name</div><div style="font:600 12.5px/1.6 var(--font-body);color:var(--muted-3)">Parent, Recreational class</div></div>
</div>
</body>
</html>
