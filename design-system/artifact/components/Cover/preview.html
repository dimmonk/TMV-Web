<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Monkey Vault Website</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-body); overflow:hidden; }
  .cover { position:relative; width:960px; height:330px; overflow:hidden; }
  .band { position:absolute; top:0; left:0; width:960px; height:112px; }
  .band svg { display:block; width:960px; height:112px; }
  .yellow { fill:var(--yellow); }
  .ink { fill:var(--ink); }
  .classes { fill:var(--cat-classes); }
  .camps { fill:var(--cat-camps); }
  .parties { fill:var(--cat-parties); }
  .card { rx:var(--radius-card); }
  .tile { rx:var(--radius-tile); }
  .pill { fill:var(--yellow); rx:4px; }
  .words { position:absolute; left:24px; right:24px; bottom:24px; max-width:640px; }
  .name { margin:0; font:900 64px/.95 var(--font-display); letter-spacing:-.02em; color:var(--ink); text-transform:none; }
  .tag { margin:10px 0 0 2px; font-size:14px; line-height:20px; color:var(--muted); }
</style>
</head>
<body>
<div class="cover">
<div class="band" aria-hidden="true">
<svg viewBox="0 0 960 112" width="960" height="112">
<!--
  blocks      yellow 360x132 bled off the top (the action colour, the brand's loudest) · ink 376x112 (the header and hero ground) · cat-classes 96x80 · cat-camps 48x96 · cat-parties 40x112 bleeding off the right edge, about a third of 960x330
  arrangement a strip of unequal bands across the top, gutters of 16px (grid-gap less 2), bottoms staggered like the card grid
  pattern     pills, from "Pills: short facts on cards and heroes": yellow 8px pills at an 18px row pitch over the ink block, the way pills sit on a dark hero
  scales      corners radius-card on the slabs and radius-tile on the ink block; pill rx half its 8px height; gutters 16px; sides in 8px multiples
-->
<rect class="yellow card" x="0" y="-20" width="360" height="132" rx="16"/>
<rect class="ink tile" x="376" y="0" width="376" height="112" rx="18"/>
<rect class="pill" x="400" y="20" width="40" height="8" rx="4"/>
<rect class="pill" x="456" y="20" width="24" height="8" rx="4"/>
<rect class="pill" x="496" y="20" width="56" height="8" rx="4"/>
<rect class="pill" x="568" y="20" width="16" height="8" rx="4"/>
<rect class="pill" x="600" y="20" width="32" height="8" rx="4"/>
<rect class="pill" x="648" y="20" width="24" height="8" rx="4"/>
<rect class="pill" x="412" y="38" width="24" height="8" rx="4"/>
<rect class="pill" x="452" y="38" width="48" height="8" rx="4"/>
<rect class="pill" x="516" y="38" width="16" height="8" rx="4"/>
<rect class="pill" x="548" y="38" width="40" height="8" rx="4"/>
<rect class="pill" x="604" y="38" width="24" height="8" rx="4"/>
<rect class="pill" x="644" y="38" width="32" height="8" rx="4"/>
<rect class="pill" x="400" y="56" width="56" height="8" rx="4"/>
<rect class="pill" x="472" y="56" width="16" height="8" rx="4"/>
<rect class="pill" x="504" y="56" width="32" height="8" rx="4"/>
<rect class="pill" x="552" y="56" width="24" height="8" rx="4"/>
<rect class="pill" x="592" y="56" width="40" height="8" rx="4"/>
<rect class="pill" x="648" y="56" width="16" height="8" rx="4"/>
<rect class="pill" x="412" y="74" width="16" height="8" rx="4"/>
<rect class="pill" x="444" y="74" width="40" height="8" rx="4"/>
<rect class="pill" x="500" y="74" width="24" height="8" rx="4"/>
<rect class="pill" x="540" y="74" width="48" height="8" rx="4"/>
<rect class="pill" x="604" y="74" width="16" height="8" rx="4"/>
<rect class="pill" x="636" y="74" width="24" height="8" rx="4"/>
<rect class="pill" x="400" y="92" width="32" height="8" rx="4"/>
<rect class="pill" x="448" y="92" width="24" height="8" rx="4"/>
<rect class="pill" x="488" y="92" width="40" height="8" rx="4"/>
<rect class="pill" x="544" y="92" width="16" height="8" rx="4"/>
<rect class="pill" x="576" y="92" width="56" height="8" rx="4"/>
<rect class="pill" x="648" y="92" width="24" height="8" rx="4"/>
<rect class="classes card" x="768" y="0" width="96" height="80" rx="16"/>
<rect class="camps card" x="880" y="0" width="48" height="96" rx="16"/>
<rect class="parties card" x="944" y="-16" width="40" height="128" rx="16"/>
</svg>
</div>
<div class="words">
<h1 class="name">The Monkey Vault<br>Website</h1>
<p class="tag">Come to play. Stay to learn.</p>
</div>
</div>
</body>
</html>
