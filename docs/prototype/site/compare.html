<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TMV Website Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root { --bg:#f5f4f1; --ink:#211f1b; --muted:#6b6862; --line:#e5e3de; --card:#fff; --brand:#ffd400; --bar:#211f1b; --barink:#fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16150f; --ink:#f1efe9; --muted:#a9a59c; --line:#34322c; --card:#1f1e19; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg:#16150f; --ink:#f1efe9; --muted:#a9a59c; --line:#34322c; --card:#1f1e19; color-scheme: dark; }
  * { box-sizing: border-box; }
  header, .controls, .stage { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .notes { margin-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, sans-serif; }
  header { background: var(--bar); color: var(--barink); padding-block: 14px; border-bottom: 4px solid var(--brand); display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
  header h1 { font-size: 18px; margin: 0; } header h1 b { color: var(--brand); } header p { margin: 0; color: #c7c5c0; font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: end; padding-block: 12px; background: var(--card); border-bottom: 1px solid var(--line); }
  .controls label { display: grid; gap: 4px; font-size: 12px; font-weight: 700; }
  select, button { font: 600 13px/1.3 system-ui, sans-serif; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--ink); min-height: 40px; }
  button { cursor: pointer; } button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #211f1b; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .width { flex: 1 1 320px; display: grid; gap: 6px; font-size: 12px; font-weight: 700; }
  .width-row { display: flex; align-items: center; gap: 12px; }
  .width input { flex: 1; accent-color: #b89a00; min-width: 140px; }
  .width output { font: 700 13px/1 system-ui, sans-serif; min-width: 128px; }
  .notes { margin-top: 12px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .notes h2 { font-size: 13px; margin: 10px 0 6px; } .notes h2:first-child { margin-top: 0; } .notes ul { margin: 0; padding-left: 18px; } .notes li { margin: 2px 0; }
  .stage { display: flex; justify-content: center; gap: 20px; padding-block: 16px; align-items: flex-start; }
  .preview { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  .preview[hidden] { display: none; }
  .preview h2 { font-size: 13px; margin: 0 0 8px; align-self: stretch; text-align: center; } .preview h2 span { font-weight: 400; color: var(--muted); }
  .frame { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
  .frame iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #fff; }
</style>
<header><h1><b>The Monkey Vault</b> &middot; website prototype</h1><p>Now = the site as built today. Proposed = the change under review. Nothing here is live.</p></header>
<div class="controls">
  <label>Page<select id="page"></select></label>
  <div class="seg" id="seg" role="group" aria-label="Show">
    <button type="button" data-v="proposed" aria-pressed="true">Proposed</button>
    <button type="button" data-v="now" aria-pressed="false">Now</button>
    <button type="button" data-v="both" aria-pressed="false">Side by side</button>
  </div>
  <div class="width">
    <span>Screen width</span>
    <div class="width-row">
      <input id="width" type="range" min="320" max="1440" step="1" value="375" aria-label="Screen width in pixels">
      <output id="widthOut" for="width"></output>
    </div>
    <div class="seg" id="snaps" role="group" aria-label="Snap to">
      <button type="button" data-w="375">Phone</button>
      <button type="button" data-w="820">Tablet</button>
      <button type="button" data-w="1440">Desktop</button>
    </div>
  </div>
</div>
<section class="notes" id="notes" aria-live="polite"></section>
<main class="stage" id="stage">
  <section class="preview" data-v="now" hidden><h2>Now <span>today's site</span></h2><div class="frame"><iframe title="The site today"></iframe></div></section>
  <section class="preview" data-v="proposed"><h2>Proposed <span>from the brief</span></h2><div class="frame"><iframe title="The proposed site"></iframe></div></section>
</main>
<script>
  // One row per page: where it lives in each build, what changed, and the phone-only lines left out (brief rule 2).
  var PAGES = [
    { label: 'Home', now: '', proposed: '', notes: [
      'One page at every width: the desktop content, laid out for the phone first. The separate phone copy is gone.',
      'Phone and tablet: headline and buttons first, the gym photos after them (no screen of photo first).',
      'Phone: the three hero numbers in one row; goal chips two to a row; reviews swipe sideways one at a time.',
      'Phone now also shows what only the desktop had: both camp cards (Winter and P.A. Day), "Browse activities", and "Leave a review".',
      'Desktop (1024 and up): unchanged.'
    ], left: ['Phone hero lines "intro · 1-on-1" and "open weekly" (the desktop says "intro lesson · 1-on-1" and "open every week").'] },
    { label: 'Schedule', now: 'schedule/', proposed: 'schedule/', notes: [
      'One page, one schedule: below desktop the week is a list of days (from today), at desktop the 7-day grid as now.',
      'Phone gets the desktop filters (Parent & Child · Kids, Athletic Program...), scrolling sideways in one row.',
      'Tap a class on the phone or tablet for its details, the same card desktop opens on click.',
      'Your saved default filter in Members now applies on phones too (it was desktop only).',
      'Desktop (1024 and up): unchanged.'
    ], left: ['Phone hero title "This week at the gym" (the desktop says "The full class schedule, always up to date.").'] },
    { label: 'First Visit', now: 'get-started/', proposed: 'get-started/', notes: [
      'One page at every width: the desktop steps, cards and questions, laid out for the phone.',
      'Phone now gets what only the desktop had: the jump bar, the 15-minute arrival note, "Before you get here" in full, and the five questions at the bottom.',
      'Phone: step numbers sit beside each title; buttons full width; the back-to-top button clears the tab bar.',
      'Desktop (1024 and up): unchanged.'
    ], left: ['Phone step 3 title "Show up ready" (the desktop says "Things to know").', 'Phone shortened lines in "What to bring" (the desktop wording is kept).'] }
  ];
  var page = document.getElementById('page'), seg = document.getElementById('seg'), notes = document.getElementById('notes');
  var range = document.getElementById('width'), out = document.getElementById('widthOut'), snaps = document.getElementById('snaps');
  var previews = Array.prototype.slice.call(document.querySelectorAll('.preview'));
  var mode = 'proposed';
  var src = function (v, path) { return v + '/' + path + 'index.html'; };
  PAGES.forEach(function (p, i) { var o = document.createElement('option'); o.value = String(i); o.textContent = p.label; page.appendChild(o); });
  function kind(w) { return w < 768 ? 'phone' : w < 1024 ? 'tablet' : 'desktop'; }
  function list(title, items) {
    if (!items.length) return;
    var h = document.createElement('h2'); h.textContent = title; notes.appendChild(h);
    var ul = document.createElement('ul'); items.forEach(function (n) { var li = document.createElement('li'); li.textContent = n; ul.appendChild(li); }); notes.appendChild(ul);
  }
  function show() {
    var p = PAGES[Number(page.value)];
    previews.forEach(function (s) { s.querySelector('iframe').src = src(s.dataset.v, p[s.dataset.v]); });
    notes.textContent = '';
    list('What changed on ' + p.label, p.notes);
    list('Only on the old phone copy, left out (say if any should stay)', p.left);
    try { localStorage.setItem('proto-site-page', page.value); } catch (e) { /* storage blocked: start on Home next time */ }
  }
  // The frame renders the page at the chosen width (so the site's own breakpoints apply) and scales it down to fit.
  function layout() {
    var w = Number(range.value);
    out.textContent = w + 'px · ' + kind(w);
    snaps.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(kind(Number(b.dataset.w)) === kind(w))); });
    var shown = previews.filter(function (s) { return !s.hidden; });
    var stage = document.getElementById('stage');
    var avail = (stage.clientWidth - parseFloat(getComputedStyle(stage).paddingLeft) - parseFloat(getComputedStyle(stage).paddingRight) - 20 * (shown.length - 1)) / shown.length;
    var scale = Math.min(1, avail / w);
    var h = Math.max(480, window.innerHeight - stage.getBoundingClientRect().top + window.scrollY - 60);
    shown.forEach(function (s) {
      var frame = s.querySelector('.frame'), f = s.querySelector('iframe');
      frame.style.width = Math.round(w * scale) + 'px';
      frame.style.height = Math.round(h) + 'px';
      f.style.width = w + 'px';
      f.style.height = Math.round(h / scale) + 'px';
      f.style.transform = 'scale(' + scale + ')';
    });
  }
  function pick(v) {
    mode = v;
    seg.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === v)); });
    previews.forEach(function (s) { s.hidden = !(v === 'both' || s.dataset.v === v); });
    layout();
  }
  page.addEventListener('change', show);
  range.addEventListener('input', layout);
  snaps.querySelectorAll('button').forEach(function (b) { b.addEventListener('click', function () { range.value = b.dataset.w; layout(); }); });
  seg.querySelectorAll('button').forEach(function (b) { b.addEventListener('click', function () { pick(b.dataset.v); }); });
  window.addEventListener('resize', layout);
  try { var saved = localStorage.getItem('proto-site-page'); if (saved && PAGES[Number(saved)]) page.value = saved; } catch (e) { /* storage blocked */ }
  show();
  pick(mode);
</script>
