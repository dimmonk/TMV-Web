<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TMV Website Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root { --bg:#f5f4f1; --ink:#211f1b; --muted:#6b6862; --line:#e5e3de; --card:#fff; --brand:#ffd400; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16150f; --ink:#f1efe9; --muted:#a9a59c; --line:#34322c; --card:#1f1e19; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg:#16150f; --ink:#f1efe9; --muted:#a9a59c; --line:#34322c; --card:#1f1e19; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  /* One slim bar; everything else is the site. */
  .bar { position: relative; flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px max(10px, env(safe-area-inset-left, 0px)); background: var(--card); border-bottom: 1px solid var(--line); }
  select, button { font: 600 12.5px/1.2 system-ui, sans-serif; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); min-height: 32px; }
  button { cursor: pointer; } button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #211f1b; }
  .seg { display: flex; gap: 4px; }
  .width { flex: 1 1 200px; display: flex; align-items: center; gap: 8px; min-width: 180px; }
  .width input { flex: 1; accent-color: #b89a00; min-width: 80px; }
  .width output { font-weight: 700; white-space: nowrap; min-width: 92px; }
  /* What changed: a panel over the preview, closed until asked for. */
  .notes { position: absolute; z-index: 5; top: 100%; right: 8px; left: 8px; max-width: 560px; margin-left: auto; max-height: 70vh; overflow: auto; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 16px 40px -12px rgba(0,0,0,.35); }
  .notes[hidden] { display: none; }
  .notes h2 { font-size: 13px; margin: 10px 0 6px; } .notes h2:first-child { margin-top: 0; } .notes ul { margin: 0; padding-left: 18px; } .notes li { margin: 2px 0; }
  /* A phone-sized window: one row that scrolls sideways; the snaps replace the slider. */
  @media (max-width: 760px) {
    .bar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .bar::-webkit-scrollbar { display: none; }
    .bar > * { flex: none; }
    .width { display: none; }
    .notes { position: fixed; top: 46px; }
  }
  .stage { flex: 1; min-height: 0; display: flex; justify-content: center; gap: 12px; padding: 8px; align-items: flex-start; }
  .preview { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  .preview[hidden] { display: none; }
  .preview h2 { font-size: 11px; margin: 0 0 4px; color: var(--muted); } .stage:not(.both) .preview h2 { display: none; }
  .frame { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .frame iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #fff; }
</style>
<div class="bar">
  <select id="page" aria-label="Page"></select>
  <div class="seg" id="seg" role="group" aria-label="Show">
    <button type="button" data-v="proposed" aria-pressed="true">Proposed</button>
    <button type="button" data-v="now" aria-pressed="false">Now</button>
    <button type="button" data-v="both" aria-pressed="false">Both</button>
  </div>
  <div class="seg" id="snaps" role="group" aria-label="Snap to">
    <button type="button" data-w="375">Phone</button>
    <button type="button" data-w="820">Tablet</button>
    <button type="button" data-w="1440">Desktop</button>
  </div>
  <div class="width">
    <input id="width" type="range" min="320" max="1440" step="1" value="375" aria-label="Screen width in pixels">
    <output id="widthOut" for="width"></output>
  </div>
  <button type="button" id="notesBtn" aria-expanded="false" aria-controls="notes">What changed</button>
  <section class="notes" id="notes" hidden></section>
</div>
<main class="stage" id="stage">
  <section class="preview" data-v="now" hidden><h2>Now</h2><div class="frame"><iframe title="The site today"></iframe></div></section>
  <section class="preview" data-v="proposed"><h2>Proposed</h2><div class="frame"><iframe title="The proposed site"></iframe></div></section>
</main>
<script>
  // One row per page: where it lives in each build, what changed, and the phone-only lines left out (brief rule 2).
  var PAGES = [
    { label: 'Home', now: '', proposed: '', notes: [
      'Differences from live: the first hero number is the $25 open gym; "Just play & burn energy" is first in the goal list; the goal list is real tabs (on a phone every goal starts closed, tap to open or close); the phone layout (compact hero, short labels, review strip, both camp cards).',
      'Everything else (wording, buttons, answers, section order, card order) is as live.'
    ], left: ['Kept off the phone on purpose: the section numbers (01, 02...) and the review section heading (the strip carries the rating).'] },
    { label: 'Schedule', now: 'schedule/', proposed: 'schedule/', notes: [
      'One page, one schedule. Phone keeps its design: the short title "This week at the gym", short filter chips (All, Kids, Teens, Adults, Athletic, Open Gym), and the day cards from today on (class, then time and ages on one line).',
      'Tablet: the same day cards in a wider column. Desktop (1024 and up): the 7-day grid, unchanged.',
      'Phone now also gets: the "See the price list" and "Explore the classes" links (side by side), the Open Gym filter, and the Members default filter.',
      'Tap a class on the phone or tablet for its details, the same card desktop opens on click.'
    ], left: ['The days already past this week stay off the phone and tablet list, as on the old phone screen.'] },
    { label: 'First Visit', now: 'get-started/', proposed: 'get-started/', notes: [
      'One page at every width. Phone keeps its design: the compact hero, numbered steps (number beside the title, no "Step one" labels), full-width note and button, and the short "What to bring" and "When you arrive" lines.',
      'Step two: heading "Pick your first visit" and an Open Gym row first, then the intro and the private lesson as live. Paragraph as live.',
      'Phone now also gets: the 15-minute arrival note in full, "Before you get here" and "I\'m at the gym. What now?" cards, and the five questions at the bottom.',
      'No jump bar and no back-to-top button on the phone, as before (the tab bar does that job).',
      'Desktop (1024 and up): unchanged.'
    ], left: [] }
  ];
  var page = document.getElementById('page'), seg = document.getElementById('seg'), notes = document.getElementById('notes');
  var range = document.getElementById('width'), out = document.getElementById('widthOut'), snaps = document.getElementById('snaps');
  var previews = Array.prototype.slice.call(document.querySelectorAll('.preview'));
  var mode = 'proposed';
  var src = function (v, path) { return v + '/' + path + 'index.html'; };
  PAGES.forEach(function (p, i) { var o = document.createElement('option'); o.value = String(i); o.textContent = p.label; page.appendChild(o); });
  function kind(w) { return w < 768 ? 'phone' : w < 1024 ? 'tablet' : 'desktop'; }
  function list(title, items) {
    if (!items.length) return;
    var h = document.createElement('h2'); h.textContent = title; notes.appendChild(h);
    var ul = document.createElement('ul'); items.forEach(function (n) { var li = document.createElement('li'); li.textContent = n; ul.appendChild(li); }); notes.appendChild(ul);
  }
  function show() {
    var p = PAGES[Number(page.value)];
    previews.forEach(function (s) { s.querySelector('iframe').src = src(s.dataset.v, p[s.dataset.v]); });
    notes.textContent = '';
    list('What changed on ' + p.label, p.notes);
    list('Kept as the phone had it', p.left);
    try { localStorage.setItem('proto-site-page', page.value); } catch (e) { /* storage blocked: start on Home next time */ }
  }
  // The frame renders the page at the chosen width (so the site's own breakpoints apply) and scales it down to fit.
  function layout() {
    var w = Number(range.value);
    out.textContent = w + 'px ' + kind(w);
    snaps.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(kind(Number(b.dataset.w)) === kind(w))); });
    var shown = previews.filter(function (s) { return !s.hidden; });
    var stage = document.getElementById('stage');
    var avail = (stage.clientWidth - parseFloat(getComputedStyle(stage).paddingLeft) - parseFloat(getComputedStyle(stage).paddingRight) - 12 * (shown.length - 1)) / shown.length;
    var scale = Math.min(1, avail / w);
    var h = Math.max(300, stage.clientHeight - parseFloat(getComputedStyle(stage).paddingTop) * 2 - (mode === 'both' ? 18 : 0));
    shown.forEach(function (s) {
      var frame = s.querySelector('.frame'), f = s.querySelector('iframe');
      frame.style.width = Math.round(w * scale) + 'px';
      frame.style.height = Math.round(h) + 'px';
      f.style.width = w + 'px';
      f.style.height = Math.round(h / scale) + 'px';
      f.style.transform = 'scale(' + scale + ')';
    });
  }
  function pick(v) {
    mode = v;
    seg.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === v)); });
    previews.forEach(function (s) { s.hidden = !(v === 'both' || s.dataset.v === v); });
    document.getElementById('stage').classList.toggle('both', v === 'both');
    layout();
  }
  var notesBtn = document.getElementById('notesBtn');
  notesBtn.addEventListener('click', function () {
    notes.hidden = !notes.hidden;
    notesBtn.setAttribute('aria-expanded', String(!notes.hidden));
    notesBtn.setAttribute('aria-pressed', String(!notes.hidden));
  });
  page.addEventListener('change', show);
  range.addEventListener('input', layout);
  snaps.querySelectorAll('button').forEach(function (b) { b.addEventListener('click', function () { range.value = b.dataset.w; layout(); }); });
  seg.querySelectorAll('button').forEach(function (b) { b.addEventListener('click', function () { pick(b.dataset.v); }); });
  window.addEventListener('resize', layout);
  try { var saved = localStorage.getItem('proto-site-page'); if (saved && PAGES[Number(saved)]) page.value = saved; } catch (e) { /* storage blocked */ }
  show();
  pick(mode);
</script>
